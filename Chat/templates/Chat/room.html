<!DOCTYPE html>
<html>
<head>
    <title>Room: {{ room_name }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5;
               display: flex; justify-content: center;
               align-items: center; height: 100vh; }
        .chat-box { width: 420px; background: white; border-radius: 12px;
                    overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
                    display: flex; flex-direction: column; height: 560px; }
        .header { background: #075e54; color: white; padding: 14px 18px;
                  font-size: 16px; font-weight: bold; }
        .header span { font-size: 12px; color: #aedba7; display: block; margin-top: 2px; }
        .name-bar { padding: 8px 12px; background: #f8f8f8; border-bottom: 1px solid #eee; }
        .name-bar input { width: 100%; padding: 6px 10px; border: 1px solid #ddd;
                          border-radius: 16px; font-size: 13px; outline: none; }
        .messages { flex: 1; overflow-y: auto; padding: 14px; background: #e5ddd5;
                    display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px;
                   font-size: 14px; line-height: 1.4; }
        .message.received { background: white; align-self: flex-start;
                            border-radius: 0 8px 8px 8px; }
        .message.sent { background: #dcf8c6; align-self: flex-end;
                        border-radius: 8px 0 8px 8px; }
        .message .name { font-size: 11px; font-weight: bold;
                         color: #075e54; margin-bottom: 3px; }
        .input-area { padding: 10px 12px; background: #f0f0f0;
                      display: flex; gap: 8px; align-items: center; }
        .input-area input { flex: 1; padding: 9px 14px; border: none;
                            border-radius: 22px; background: white;
                            font-size: 14px; outline: none; }
        .input-area button { width: 40px; height: 40px; border-radius: 50%;
                             border: none; background: #25D366; color: white;
                             font-size: 18px; cursor: pointer; }
        #status { text-align: center; padding: 5px; font-size: 12px; color: #aaa; }
        #status.connected { color: #25D366; }
        #status.disconnected { color: #e55; }
    </style>
</head>
<body>
<div class="chat-box">
    <div class="header">
        💬 {{ room_name }}
        <span>Django Channels WebSocket</span>
    </div>
    <div class="name-bar">
        <input type="text" id="senderName" placeholder="Your name (e.g. Ali, Sara...)" />
    </div>
    <div id="status">Connecting...</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    const roomName = "{{ room_name }}";  // Django injects the room name here
    // Open a persistent WebSocket connection - triggers connect() in consumer
    const socket = new WebSocket(`ws://${window.location.host}/ws/chat/${roomName}/`);
    socket.onopen = function() {
        const s = document.getElementById('status');
        s.textContent = '● Connected'; s.className = 'connected';
    };
    socket.onclose = function() {
        const s = document.getElementById('status');
        s.textContent = '● Disconnected'; s.className = 'disconnected';
    };
    // Fires when server calls chat_message() and sends data back
    socket.onmessage = function(event) {
        const data   = JSON.parse(event.data);
        const myName = document.getElementById('senderName').value;
        const div    = document.createElement('div');
        // Sent by me → green right bubble; by others → white left bubble
        // textContent, never innerHTML: messages come from other users and could contain <script>
        if (data.sender === myName) {
            div.className = 'message sent';
        } else {
            div.className = 'message received';
            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = data.sender;
            div.appendChild(name);
        }
        const text = document.createElement('div');
        text.textContent = data.message;
        div.appendChild(text);
        const msgs = document.getElementById('messages');
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;  // auto-scroll to latest
    };
    // Triggered by button click or Enter key - fires receive() in consumer
    function sendMessage() {
        const msgEl    = document.getElementById('messageInput');
        const senderEl = document.getElementById('senderName');
        const message  = msgEl.value.trim();
        const sender   = senderEl.value.trim() || 'Anonymous';
        if (message === '') return;
        socket.send(JSON.stringify({ 'message': message, 'sender': sender }));
        msgEl.value = '';  // clear input after sending
    }
    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
