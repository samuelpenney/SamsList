{% extends "base.html" %}
{% block content %}
<div class="post-entry">
    <h2>{{ post.title }}</h2>
    <p>{{ post.zip_code }}</p>
    <p>{{ post.body }}</p>
</div>
<div>
    {% if post.author == user %}
    <p><a href="{% url 'post_edit' post.pk %}">+ Edit Listing</a></p>
    <p><a href="{% url 'post_delete' post.pk %}">+ Delete Listing</a></p>
    {%endif%}
</div>
{% endblock content %}
