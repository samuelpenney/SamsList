{% load static %}
<html>
<head>
  <title>Sam's List</title>
  <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/base.css' %}" rel="stylesheet">
</head>

<body>
  <div>
    <header>
      <div class="nav-left">
        <img src="{% static '/images/slogo.png' %}" alt="SL Logo" width="60">
        <h1><a href="{% url 'home' %}">Sam's List</a></h1>
      </div>
      <div class="nav-right">
        {% if user.is_authenticated %}
          <a href="{% url 'post_new' %}" style="margin-right: 20px;">+ New Listing</a>
          <details class="nav-dropdown">
            <summary class="hamburger-btn" aria-label="Menu">&#9776;</summary>
            <nav class="custom-dropdown-menu">
              <a href="{% url 'account_edit' %}">My Account</a>
              <a href="{% url 'password_change' %}">Change Password</a>
              <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" style="margin-top: 7px;">Log Out</button>
              </form>
            </nav>
          </details>
        {%else%}
          <a href="{% url 'login' %}">Log In</a> |
          <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
      </div>
    </header>
    {% block content %}
    {% endblock content %}
  </div>
</body>
</html>
